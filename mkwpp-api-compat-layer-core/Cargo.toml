[package]
name = "mkwpp-api-compat-layer-core"
version = "0.1.1"
edition = "2024"

[dependencies]
actix-web = { version = "4.11.0", optional = true }
paste = "1.0.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"

[dev-dependencies]
strum = { version = "*",features = ["derive"] }

[features]
default = ["rust-actix"]
rust-actix = ["dep:actix-web"]

[lints]
workspace = true

